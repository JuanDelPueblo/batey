[package]
name = "batey"
version = "0.4.0"
edition = "2021"
authors = ["JuanDelPueblo"]
description = "Persistent single-owner ACP project and chat supervisor"
license = "GPL-3.0-only"
repository = "https://github.com/JuanDelPueblo/batey"
keywords = ["acp", "agent", "supervisor", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Async runtime.
# "full" compiles every tokio driver. This list holds only the drivers the
# crate uses. It makes the dependency graph smaller and the build faster.
tokio = { version = "1.43", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "process",
    "signal",
    "sync",
    "time",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }

# Web server
axum = { version = "0.7", features = ["ws"] }
rust-embed = { version = "8.5", features = ["axum"] }
mime_guess = "2.0"

# WebSocket
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# ACP protocol types
agent-client-protocol-schema = { version = "1.7", default-features = false }

# ACP Registry download. `rustls-tls` keeps the trust anchors in the binary,
# so a Nix build needs no system OpenSSL and no system certificate store.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
] }
url = "2.5"

# Registry archive integrity and extraction. The registry format allows
# `.zip`, `.tar.gz`, `.tgz`, `.tar.bz2`, `.tbz2`, and raw binaries.
sha2 = "0.10"
tar = "0.4"
flate2 = "1.1"
# The default feature selects the pure-Rust `libbz2-rs-sys` backend.
bzip2 = "0.6"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Process group / Job Object wrapper for cross-platform child process cleanup
process-wrap = { version = "6", default-features = false, features = ["std", "tokio1", "job-object", "kill-on-drop", "process-group"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
# Terminal authentication needs a real PTY, and the whole process tree must
# die on cancel. The Unix spawn path makes the child a session leader, so
# `killpg` reaches every descendant.
portable-pty = { version = "0.9", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
# `oneshot` drives the axum router directly in the integration tests.
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
# The authentication tests capture tracing output with their own subscriber.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The Rust sources sit in `backend/src`, next to the fake backend, so Cargo
# needs the paths. Integration tests keep the default `tests/` location.
[lib]
name = "batey"
path = "backend/src/lib.rs"

[[bin]]
name = "batey"
path = "backend/src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Full debug info is a large part of the compile time and of the link time.
# Line tables keep backtraces readable and keep panic locations exact.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Debug info for dependency code is rarely useful and it is expensive to
# generate and to link. Own code keeps its line tables.
[profile.dev.package."*"]
debug = false

<div
  class="tool-activity"
  [class.status-running]="isRunning()"
  [class.status-completed]="isCompleted()"
  [class.status-failed]="isFailed()"
  [class.subagent-tool]="isSubagentChild()"
  [class.expanded]="isExpanded()"
  [class.has-details]="hasDetails()">

  <button
    type="button"
    class="tool-header"
    [disabled]="!hasDetails()"
    [attr.aria-expanded]="hasDetails() ? isExpanded() : null"
    [attr.aria-controls]="hasDetails() ? detailsId() : null"
    [attr.aria-label]="accessibleHeaderLabel()"
    (click)="toggleExpanded()">

    <div class="tool-leading">
      @if (isSubagentChild()) {
        <span class="subagent-badge" title="Subagent activity">
          <mat-icon class="subagent-icon" aria-hidden="true">account_tree</mat-icon>
          <span class="subagent-text">Subagent</span>
        </span>
      }
      <mat-icon class="kind-icon" aria-hidden="true">{{ icon() }}</mat-icon>
    </div>

    <div class="tool-body">
      <span class="tool-title">{{ displayTitle() }}</span>
      @if (displaySummary()) {
        <span class="tool-summary" [title]="displaySummary()">{{ displaySummary() }}</span>
      }
    </div>

    <div class="tool-status">
      @if (isRunning()) {
        <span class="status-indicator status-indicator-running">
          <mat-icon class="status-icon spin-icon" aria-hidden="true">progress_activity</mat-icon>
          <span class="status-text">Running</span>
        </span>
      } @else if (isFailed()) {
        <span class="status-indicator status-indicator-failed">
          <mat-icon class="status-icon" aria-hidden="true">error</mat-icon>
          <span class="status-text">Failed</span>
        </span>
      } @else {
        <span class="status-indicator status-indicator-completed">
          <mat-icon class="status-icon" aria-hidden="true">check</mat-icon>
          <span class="sr-only">Completed</span>
        </span>
      }

      @if (hasDetails()) {
        <mat-icon
          class="expand-icon"
          [class.expanded]="isExpanded()"
          aria-hidden="true">expand_more</mat-icon>
      }
    </div>
  </button>

  @if (hasDetails() && isExpanded()) {
    <div [id]="detailsId()" class="tool-details" role="region" [attr.aria-label]="displayTitle() + ' details'">
      @if (tool().locations?.length) {
        <div class="tool-locations" aria-label="Related files">
          <mat-icon class="locations-icon" aria-hidden="true">link</mat-icon>
          <div class="locations-list">
            @for (loc of tool().locations!; track loc.path) {
              <span class="location">{{ loc.path }}@if (loc.line != null) {:{{ loc.line }}}</span>
            }
          </div>
        </div>
      }

      @if (cleanOutput()) {
        <div class="tool-output-wrapper">
          <pre class="tool-output">{{ cleanOutput() }}</pre>
        </div>
      }

      @if (richContent().length) {
        <div class="tool-rich-content">
          <hub-rich-content [blocks]="richContent()" />
        </div>
      }
    </div>
  }
</div>
